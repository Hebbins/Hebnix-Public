name: Build Hebnix

# manual only for now: go to the "Actions" tab on GitHub, pick this workflow,
# click "Run workflow". nothing runs automatically on push/PR.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hebnix_rs -> target

      - name: cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: hebnix_rs/vendor/curl-impersonate
          key: hebnix-vendor-${{ runner.os }}-curl-1.5.6-cacert-2026-05-14

      - name: install third-party dependencies
        run: .\build.bat package --skip-deps
        shell: cmd
        continue-on-error: false
        env:
          CI: true

      - name: verify dependencies
        run: |
          if (!(Test-Path "hebnix_rs\vendor\curl-impersonate\curl-impersonate.exe")) {
            Write-Error "curl-impersonate.exe not found"
            exit 1
          }
          if (!(Test-Path "hebnix_rs\vendor\curl-impersonate\cacert.pem")) {
            Write-Error "cacert.pem not found"
            exit 1
          }
          Write-Host "Dependencies verified successfully"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: hebnix-windows
          path: hebnix_rs/dist/
          if-no-files-found: error
