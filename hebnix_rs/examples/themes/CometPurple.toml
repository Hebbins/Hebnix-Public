# black background, purple accent, uses the Lexend font. put this file in
# themes/, put examples/fonts/Lexend.ttf in fonts/, then pick "CometPurple"
# in Settings > Theme.
#
# the font line is optional on any theme, just leave it out to use the
# default font. it looks for a ttf or otf with a matching name in fonts/.

base = "dark"
font = "Lexend"

[colors]
accent    = "#A177FF"
window_bg = "#000000"
panel_bg  = "#000000"
widget_bg = "#141014"
text      = "#FFFFFF"
hyperlink = "#B69CFF"
warn      = "#F1FA8C"
error     = "#FF6E6E"
