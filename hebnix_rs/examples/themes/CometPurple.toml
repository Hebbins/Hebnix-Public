# AMOLED black + Material purple accent, paired with Lexend. drop this in the
# themes/ folder next to the exe, and drop examples/fonts/Lexend.ttf into the
# fonts/ folder next to it, then pick "CometPurple" in Settings > Theme.
# `font` is optional on any theme -- omit it to keep the default egui font.
# it matches (case-insensitively) a .ttf/.otf file stem in the fonts/ folder.

base = "dark"
font = "Lexend"

[colors]
accent    = "#A177FF"
window_bg = "#000000"
panel_bg  = "#000000"
widget_bg = "#141014"
text      = "#FFFFFF"
hyperlink = "#B69CFF"
warn      = "#F1FA8C"
error     = "#FF6E6E"
